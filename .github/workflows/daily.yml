name: Daily AI Scraper

on:
  schedule:
    # 每天早上 8 點執行（台灣時間）
    - cron: '0 0 * * *'
  workflow_dispatch: # 讓你隨時可以手動點擊執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: pip install -r requirements.txt

      - name: 執行 Python 爬蟲與 AI 分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
