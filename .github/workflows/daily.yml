name: Daily AI Scraper

on:
  schedule:
    # 每天 UTC 時間 0 點執行（相當於台灣時間每天早上 8 點）
    - cron: '0 0 * * *'
  workflow_dispatch: # 讓你可以隨時手動點擊執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: pip install -r requirements.txt

      - name: 執行 Python 爬蟲與 AI 分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
